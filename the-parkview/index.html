const fmt = (n) => n == null ? "" : `$${n.toFixed(2)}`;

function useScrolled(threshold = 12) {
    const [scrolled, setScrolled] = useState(false);
    useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > threshold);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
    }, [threshold]);
    return scrolled;
}

function getOpenStatus(now = new Date()) {
    const day = now.getDay();
    const today = INFO.hours[day];
    const hour = now.getHours() + now.getMinutes() / 60;

    if (today.open != null && hour >= today.open && hour < today.close) {
        return { open: true, label: `Open until ${formatHour(today.close)}` };
    }
    for (let i = 0; i < 7; i++) {
        const next = INFO.hours[(day + i) % 7];
        if (next.open != null) {
            if (i === 0 && hour < next.open) {
                return { open: false, label: `Opens today at ${formatHour(next.open)}` };
            }
            if (i > 0) {
                return { open: false, label: `Opens ${next.label} at ${formatHour(next.open)}` };
            }
        }
    }
    return { open: false, label: "Currently closed" };
}

function formatHour(h) {
    const period = h >= 12 ? "PM" : "AM";
    const hr = h % 12 === 0 ? 12 : h % 12;
    return `${hr}${period}`;
}

function highlight(text, q) {
    if (!q || !text) return text;
    const i = text.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return text;
    return (
        <>
            {text.slice(0, i)}
            <mark className="match">{text.slice(i, i + q.length)}</mark>
            {text.slice(i + q.length)}
        </>
    );
}

    const results = useMemo(() => {
        if (!searching) return [];
        const matches = [];
        for (const sec of MENU) {
            const pools = [
                ...(sec.items || []).map(it => ({ it, dual: !!sec.dual })),
                ...(sec.extras || []).map(it => ({ it, dual: false }))
            ];
            for (const { it, dual } of pools) {
                const hay = `${it.name || ""} ${it.desc || ""}`.toLowerCase();
                if (hay.includes(q)) {
                    matches.push({ item: it, sectionTitle: sec.title, sectionId: sec.id, dual });
                }
            }
        }
        return matches;
    }, [q, searching]);

    return (
        <section className="block" id="menu">
            <div className="container">
                <div className="section-eyebrow">The Menu</div>
                <h2 className="section-title">Maritime comfort food, made fresh</h2>
                <p className="section-lead">
                    Homemade soups, hand-pressed burgers, real gravy, fresh fish, and whatever pie
                    came out of the oven this morning. Sub potato for salad or poutine on any platter
                    for $3.
                </p>

                <div className="menu-search">
                    <svg className="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input
                        type="search"
                        placeholder="Search the menu - try 'turkey', 'poutine', 'fish'..."
                        value={query}
                        onChange={(e) => setQuery(e.target.value)}
                        aria-label="Search the menu"
                    />
                    {query && (
                        <button className="clear" aria-label="Clear search" onClick={() => setQuery("")}>
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round">
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                            </svg>
                        </button>
                    )}
                </div>

                {!searching && (
                    <div className="menu-tabs" role="tablist">
                        {MENU.map(s => (
                            <button
                                key={s.id}
                                role="tab"
                                aria-selected={active === s.id}
                                className={active === s.id ? "active" : ""}
                                onClick={() => setActive(s.id)}
                            >
                                {s.title}
                            </button>
                        ))}
                    </div>
                )}

                {searching ? (
                    <div className="menu-section" key="search">
                        <div className="search-summary">
                            {results.length === 0
                                ? <>No items match <strong>"{query}"</strong>. Try another word, or <button className="link-btn" onClick={() => setQuery("")}>clear search</button>.</>
                                : <>Showing <strong>{results.length}</strong> {results.length === 1 ? "match" : "matches"} for <strong>"{query}"</strong></>
                            }
                        </div>
                        {results.length > 0 && (
                            <div className="menu-list">
                                {results.map((r, i) => (
                                    <div className={`menu-item ${r.dual ? "dual" : ""}`} key={i}>
                                        <div>
                                            <div className="name">{highlight(r.item.name, query)}</div>
                                            {r.item.desc && <div className="desc">{highlight(r.item.desc, query)}</div>}
                                            <button
                                                className="result-section-tag"
                                                onClick={() => { setQuery(""); setActive(r.sectionId); }}
                                                title={`Jump to ${r.sectionTitle}`}
                                            >
                                                {r.sectionTitle}
                                            </button>
                                        </div>
                                        {r.dual ? (
                                            <>
                                                <div className="price">{fmt(r.item.prices[0])}</div>
                                                <div className="price">{fmt(r.item.prices[1])}</div>
                                            </>
                                        ) : (
                                            r.item.price != null && <div className="price">{fmt(r.item.price)}</div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                ) : (
                    <div className="menu-section" key={section.id}>
                        <h3 style={{ fontSize: "1.6rem", marginBottom: "0.6rem" }}>{section.title}</h3>
                        {section.note && <div className="menu-note">{section.note}</div>}

                        {section.dual ? (
                            <>
                                <div className="menu-dual-header">
                                    <div></div>
                                    <div className="col">{section.cols[0]}</div>
                                    <div className="col">{section.cols[1]}</div>
                                </div>
                                <div className="menu-list">
                                    {section.items.map((item, i) => (
                                        <div className="menu-item dual" key={i}>
                                            <div>
                                                <div className="name">{item.name}</div>
                                                {item.desc && <div className="desc">{item.desc}</div>}
                                            </div>
                                            <div className="price">{fmt(item.prices[0])}</div>
                                            <div className="price">{fmt(item.prices[1])}</div>
                                        </div>
                                    ))}
                                </div>
                                {section.extras && (
                                    <div className="menu-list" style={{ marginTop: "1.5rem" }}>
                                        {section.extras.map((item, i) => (
                                            <div className="menu-item" key={i}>
                                                <div>
                                                    <div className="name">{item.name}</div>
                                                    {item.desc && <div className="desc">{item.desc}</div>}
                                                </div>
                                                <div className="price">{fmt(item.price)}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </>
                        ) : (
                            <div className="menu-list">
                                {section.items.map((item, i) => (
                                    <div className="menu-item" key={i}>
                                        <div>
                                            <div className="name">{item.name}</div>
                                            {item.desc && <div className="desc">{item.desc}</div>}
                                        </div>
                                        {item.price != null && <div className="price">{fmt(item.price)}</div>}
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}
            </div>
        </section>
    );
}

function StickyCall() {
    const [show, setShow] = useState(false);
    useEffect(() => {
        const onScroll = () => setShow(window.scrollY > window.innerHeight * 0.7);
        onScroll();
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
    }, []);
    return (
        <a
            href={`tel:${INFO.phoneRaw}`}
            className={`sticky-call ${show ? "show" : ""}`}
            aria-label={`Call The Parkview at ${INFO.phone}`}
        >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
            </svg>
            <span className="sticky-call-text">Call Us</span>
        </a>
    );
}
