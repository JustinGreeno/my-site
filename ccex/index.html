<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumberland County Exhibition | Coming Soon</title>
    <meta name="description" content="Cumberland County Exhibition - Nova Scotia's Premier Agricultural Exhibition. Coming soon — August 31 - September 6, 2026.">
    <link rel="icon" type="image/png" href="images/art/Try Logo 1 white glow.png">
    <link href="css/style.css" rel="stylesheet">
    <script src="js/countdown.js" defer></script>
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 2rem 1rem;
            box-sizing: border-box;
        }

        .construction-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.5rem;
            max-width: 660px;
            width: 100%;
        }

        .site-logo {
            width: 110px;
            height: auto;
            filter: drop-shadow(0 0 18px rgba(255,200,80,0.55));
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 14px rgba(255,200,80,0.4)); }
            50%       { filter: drop-shadow(0 0 28px rgba(255,200,80,0.75)); }
        }

        /* Sign with posts */
        .sign-post {
            position: relative;
            width: 100%;
            padding-bottom: 55px;
        }

        .sign-post::before,
        .sign-post::after {
            content: '';
            position: absolute;
            bottom: 0;
            width: 20px;
            height: 58px;
            background: linear-gradient(90deg, #5a3a1a, #8b5e2e, #6b4520, #5a3a1a);
            border-radius: 3px 3px 0 0;
            box-shadow: 2px 3px 8px rgba(0,0,0,0.55);
        }
        .sign-post::before { left: 22%; }
        .sign-post::after  { right: 22%; }

        .sign-board {
            position: relative;
            background-image:
                repeating-linear-gradient(
                    180deg,
                    transparent,
                    transparent 26px,
                    rgba(0,0,0,0.07) 26px,
                    rgba(0,0,0,0.07) 28px
                ),
                linear-gradient(155deg, #9b6b35 0%, #7a5025 35%, #6b4520 65%, #7a5025 100%);
            border: 6px solid #4a2e0f;
            border-radius: 8px;
            padding: 2.8rem 2.2rem 2.4rem;
            text-align: center;
            box-shadow:
                inset 0 3px 10px rgba(0,0,0,0.3),
                inset 0 -2px 6px rgba(255,255,255,0.05),
                0 10px 36px rgba(0,0,0,0.6),
                0 3px 0 #2e1a06;
        }

        /* Corner bolts */
        .bolt {
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle at 35% 35%, #7a6040, #3d2510);
            border-radius: 50%;
            border: 1px solid #2e1a06;
            box-shadow: inset 0 1px 2px rgba(255,255,255,0.15);
        }
        .bolt.tl { top: 12px; left: 14px; }
        .bolt.tr { top: 12px; right: 14px; }
        .bolt.bl { bottom: 12px; left: 14px; }
        .bolt.br { bottom: 12px; right: 14px; }

        .sign-eyebrow {
            font-family: 'Georgia', serif;
            font-size: 0.75rem;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: rgba(252,238,196,0.65);
            margin-bottom: 0.6rem;
        }

        .sign-title {
            font-family: 'Georgia', serif;
            font-size: clamp(1.8rem, 5.5vw, 2.8rem);
            font-weight: bold;
            color: #fceec4;
            text-shadow:
                2px 2px 0 #2e1a06,
                0 0 24px rgba(255,210,100,0.25);
            margin: 0 0 0.4rem;
            line-height: 1.2;
        }

        .sign-divider {
            width: 65%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(245,216,154,0.5), rgba(245,216,154,0.8), rgba(245,216,154,0.5), transparent);
            border: none;
            margin: 1rem auto;
        }

        .sign-sub {
            font-family: 'Georgia', serif;
            font-size: clamp(0.95rem, 2.8vw, 1.2rem);
            color: #e8c97a;
            text-shadow: 1px 1px 0 #2e1a06;
            margin: 0 0 1.4rem;
            font-style: italic;
        }

        .sign-badge {
            display: inline-block;
            background: rgba(0,0,0,0.28);
            border: 2px solid rgba(245,216,154,0.4);
            border-radius: 5px;
            padding: 0.45rem 1.5rem;
            font-family: 'Georgia', serif;
            font-size: clamp(0.9rem, 2.5vw, 1.1rem);
            color: #fceec4;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            font-weight: bold;
        }

        /* Countdown */
        .countdown-wrap {
            text-align: center;
        }

        .countdown-label {
            font-size: 0.75rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(252,238,196,0.5);
            margin-bottom: 0.8rem;
        }

        .countdown-timer {
            display: flex;
            gap: 1.2rem;
            justify-content: center;
        }

        .countdown-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
        }

        .countdown-number {
            font-family: 'Georgia', serif;
            font-size: clamp(1.8rem, 5vw, 2.6rem);
            font-weight: bold;
            color: #fceec4;
            text-shadow: 0 0 16px rgba(255,210,100,0.35);
            min-width: 2.5ch;
            text-align: center;
        }

        .countdown-unit {
            font-size: 0.62rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(252,238,196,0.45);
        }

        .footer-note {
            color: rgba(252,238,196,0.38);
            font-size: 0.73rem;
            text-align: center;
        }

        .footer-note a {
            color: rgba(252,238,196,0.52);
            text-decoration: none;
        }
        .footer-note a:hover { color: rgba(252,238,196,0.8); }
    </style>
</head>
<body>
    <div class="particles-container" id="particles"></div>

    <div class="construction-wrap">

        <img src="images/art/Try Logo 1 white glow.png" alt="CCEx Logo" class="site-logo">

        <div class="sign-post">
            <div class="sign-board">
                <div class="bolt tl"></div>
                <div class="bolt tr"></div>
                <div class="bolt bl"></div>
                <div class="bolt br"></div>

                <div class="sign-eyebrow">Cumberland County Exhibition</div>
                <h1 class="sign-title">Under Construction</h1>
                <hr class="sign-divider">
                <p class="sign-sub">New site coming soon</p>
                <span class="sign-badge">CCEx 2026 &mdash; Aug 31 &ndash; Sep 6</span>
            </div>
        </div>

        <div class="countdown-wrap">
            <div class="countdown-label">Days until CCEx</div>
            <div class="countdown-timer" id="countdown">
                <div class="countdown-item">
                    <span class="countdown-number" id="days">---</span>
                    <span class="countdown-unit">Days</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="hours">--</span>
                    <span class="countdown-unit">Hours</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="mins">--</span>
                    <span class="countdown-unit">Mins</span>
                </div>
                <div class="countdown-item">
                    <span class="countdown-number" id="secs">--</span>
                    <span class="countdown-unit">Secs</span>
                </div>
            </div>
        </div>

        <p class="footer-note">
            <a href="mailto:cumberlandexhibition@gmail.com">cumberlandexhibition@gmail.com</a>
            &nbsp;&middot;&nbsp;
            <a href="https://www.facebook.com/cumberlandex/" target="_blank">Facebook</a>
            &nbsp;&middot;&nbsp;
            &copy; 2026 Cumberland County Exhibition
        </p>

    </div>

    <script>
        (function() {
            const container = document.getElementById('particles');
            if (!container) return;
            for (let i = 0; i < 40; i++) {
                const p = document.createElement('div');
                p.className = 'particle ' + (Math.random() > 0.7 ? 'star' : 'dust');
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * 100 + '%';
                p.style.animationDelay = Math.random() * 15 + 's';
                p.style.animationDuration = (10 + Math.random() * 10) + 's';
                p.style.opacity = 0.3 + Math.random() * 0.5;
                container.appendChild(p);
            }
        })();
    </script>
</body>
</html>
